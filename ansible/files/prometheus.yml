global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'serveur-supervision'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'monitoring'

  - job_name: 'noeuds-vpn'
    static_configs:
      - targets: ['10.8.0.2:9100']
        labels:
          instance: 'node1'
