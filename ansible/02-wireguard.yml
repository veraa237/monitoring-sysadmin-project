---
- name: Mise en place du VPN WireGuard
  hosts: all
  become: true
  tasks:
    - name: Installer WireGuard
      ansible.builtin.apt:
        name: wireguard
        state: present
        update_cache: true

    - name: Générer la clé privée (si absente)
      ansible.builtin.shell: umask 077; wg genkey > /etc/wireguard/private.key
      args:
        creates: /etc/wireguard/private.key

    - name: Générer la clé publique (si absente)
      ansible.builtin.shell: wg pubkey < /etc/wireguard/private.key > /etc/wireguard/public.key
      args:
        creates: /etc/wireguard/public.key

    - name: Lire la clé publique
      ansible.builtin.slurp:
        src: /etc/wireguard/public.key
      register: wg_pub

    - name: Lire la clé privée
      ansible.builtin.slurp:
        src: /etc/wireguard/private.key
      register: wg_priv
      no_log: true

    - name: Mémoriser les clés (persistant entre exécutions grâce au cache de facts)
      ansible.builtin.set_fact:
        wg_public_key: "{{ wg_pub.content | b64decode | trim }}"
        wg_private_key: "{{ wg_priv.content | b64decode | trim }}"
        cacheable: true
      no_log: true

    - name: Déployer la configuration wg0
      ansible.builtin.template:
        src: "wg0-{{ 'server' if inventory_hostname in groups['monitoring_server'] else 'client' }}.conf.j2"
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Redémarrer WireGuard

    - name: Activer et démarrer le tunnel
      ansible.builtin.service:
        name: wg-quick@wg0
        enabled: true
        state: started

  handlers:
    - name: Redémarrer WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted
